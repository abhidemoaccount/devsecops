apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: dev-secops-cluster
  region: us-east-1
  version: "1.28"

nodeGroups:
  - name: ng-1
    instanceType: t3a.large
    desiredCapacity: 1
    volumeSize: 20
    ssh:
      allow: true # will use ~/.ssh/id_rsa.pub as the default ssh key
      publicKeyName: "mac-ncpl"
  - name: ng-2
    instanceType: t3a.xlarge
    desiredCapacity: 1
    volumeSize: 20
    ssh:
      publicKeyName: "mac-ncpl"
